[package]
name = "stellar-contract-asset-spec"
edition = "2021"
version = "0.0.0"
publish = false

[build-dependencies]
crate-git-revision = "0.0.6"

[dependencies]
stellar-asset-spec = "=30.0.0-rc.1"
stellar-xdr = { version = "30.0.0", features = [ "serde" ] }
serde_json = "1.0.128"
clap = { version = "4.2.4", default-features = false, features = ["std", "derive", "usage", "help"] }
thiserror = "1.0.64"
